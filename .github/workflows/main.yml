name: Frontend Deploy - pvb.dev.metaphi.in

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: self-hosted

    env:
      PATH: /root/.nvm/versions/node/v20.19.6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PM2_HOME: /root/.pm2

    steps:
      - name: Clean GitHub workspace
        run: |
          rm -rf "$GITHUB_WORKSPACE"/*
          rm -rf "$GITHUB_WORKSPACE"/.[!.]* || true
          rm -rf "$GITHUB_WORKSPACE"/..?* || true

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify Node.js environment
        run: |
          echo "Working Directory:"
          pwd

          echo "Node Version:"
          node -v

          echo "NPM Version:"
          npm -v

          echo "PM2 Version:"
          pm2 -v

      - name: Clean old build files
        run: |
          rm -rf node_modules
          rm -rf .next
          npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Copy application
        run: |
          set -x
      
          whoami
          pwd
      
          ls -ld /var/www/pvb.dev1.metaphi.in
      
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            ./ /var/www/pvb.dev1.metaphi.in/

      - name: Install production dependencies on server
        working-directory: /var/www/pvb.dev1.metaphi.in
        run: |
          rm -rf node_modules
          
      - name: Restart PM2
        run: |
          pm2 restart pvb.dev1.metaphi.in
          pm2 save

      - name: Debug information (runs only if workflow fails)
        if: failure()
        run: |
          echo "===== Debug Info ====="
          pwd
          ls -la
          echo "===== .next/server ====="
          find .next/server -type f | sort || true
          echo "===== Deployment Directory ====="
          ls -la /var/www/pvb.dev1.metaphi.in || true
